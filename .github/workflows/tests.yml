name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is deliberately dependency-free (stdlib only), so there is no
      # install step — CI runs exactly what adopters run locally.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Gates on the exit code only, which reflects config-schema validation.
      # The health checks are reported, never enforced (GUIDE section 13).
      #
      # Until 2026-08-29 this comment explained why the tree was NOT checked for
      # cleanliness afterwards: --self-test rewrote .ai/00-system/maturity-tracker.json
      # on every run. That write was removed as a defect -- a health check that
      # mutates the repo it reports on -- so the reason no longer applies.
      # test_hook.TestSelfTest.test_self_test_does_not_write_to_the_repository now
      # asserts the stronger property directly.
      - name: Validate workflow config (--self-test)
        run: python .claude/hooks/workflow_hook.py --self-test
