name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is deliberately dependency-free (stdlib only), so there is no
      # install step — CI runs exactly what adopters run locally.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Gates on the exit code only, which reflects config-schema validation.
      # Deliberately not asserting the tree stays clean afterwards: --self-test
      # rewrites .ai/00-system/maturity-tracker.json with today's date, so a
      # diff check would fail for the passage of time rather than a regression.
      # Nor does it gate on the maturity level -- that is reported, never
      # enforced (GUIDE section 13).
      - name: Validate workflow config (--self-test)
        run: python hooks/workflow_hook.py --self-test
